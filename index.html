<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#8f101b">
  <title>Christmas Countdown 2026</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Georgia, "Times New Roman", serif;
      background: #710d18;
      color: #fff8e8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      isolation: isolate;
      min-height: 100vh;
      margin: 0;
      padding: 48px 20px 120px;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse at 50% 0%, rgb(190 43 48 / 55%), transparent 58%),
        linear-gradient(160deg, #a51b27 0%, #7c111c 55%, #4b0912 100%);
    }

    body::before,
    body::after {
      position: fixed;
      inset: 0;
      z-index: -1;
      content: "";
      pointer-events: none;
      background-image:
        radial-gradient(3px 3px at 20px 30px, #fff 50%, transparent 65%),
        radial-gradient(2px 2px at 80px 100px, #fff 50%, transparent 65%),
        radial-gradient(3px 3px at 150px 50px, #fff 50%, transparent 65%),
        radial-gradient(2px 2px at 120px 150px, #fff 50%, transparent 65%);
      background-size: 200px 180px;
      opacity: 0.62;
      animation: snowfall 12s linear infinite;
    }

    body::after {
      background-size: 280px 240px;
      opacity: 0.38;
      animation-duration: 19s;
      animation-delay: -7s;
    }

    @keyframes snowfall {
      to {
        transform: translateY(100vh);
      }
    }

    main {
      position: relative;
      z-index: 1;
      width: min(900px, 100%);
      margin: 0 auto;
      padding-top: 70px;
      text-align: center;
    }

    .greeting {
      margin: 0 0 8px;
      color: #f4cf77;
      font-size: 1rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 7vw, 4.5rem);
      font-weight: 500;
    }

    .intro {
      margin: 12px 0 36px;
      color: #ffe0d8;
      font-family: Arial, sans-serif;
    }

    .bells {
      position: fixed;
      top: 64px;
      z-index: 2;
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      filter: drop-shadow(0 0 8px rgb(255 220 116 / 65%));
      pointer-events: none;
    }

    .bells-left {
      left: 18px;
    }

    .bells-right {
      right: 18px;
    }

    .sleigh {
      position: fixed;
      top: 8px;
      left: 0;
      z-index: 0;
      font-family: Arial, sans-serif;
      font-size: clamp(2rem, 5vw, 3rem);
      white-space: nowrap;
      filter: drop-shadow(0 0 10px rgb(255 230 160 / 70%));
      pointer-events: none;
      animation: sleigh-ride 22s linear infinite;
    }

    @keyframes sleigh-ride {
      from {
        transform: translateX(-120%);
      }
      to {
        transform: translateX(100vw);
      }
    }

    .clocks {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }

    .clock-card,
    .countdown {
      border: 1px solid rgb(244 207 119 / 42%);
      border-radius: 18px;
      background: rgb(71 8 17 / 76%);
      box-shadow: 0 12px 35px rgb(0 0 0 / 18%);
      backdrop-filter: blur(5px);
    }

    .clock-card {
      padding: 26px 18px;
    }

    .clock-card h2 {
      margin: 0 0 14px;
      color: #f4cf77;
      font-size: 1.45rem;
      font-weight: 500;
    }

    .clock-card time {
      display: block;
      font-family: Arial, sans-serif;
      font-size: clamp(1rem, 3vw, 1.15rem);
      font-variant-numeric: tabular-nums;
      line-height: 1.6;
    }

    .countdown {
      margin-top: 26px;
      padding: 24px 18px;
    }

    .countdown h2 {
      margin: 0 0 18px;
      color: #f4cf77;
      font-size: 1.6rem;
      font-weight: 500;
    }

    .countdown-values {
      display: flex;
      justify-content: center;
      gap: clamp(12px, 5vw, 42px);
      font-family: Arial, sans-serif;
    }

    .countdown-values div {
      min-width: 52px;
    }

    .countdown-values span {
      display: block;
      color: #fff;
      font-size: clamp(1.8rem, 6vw, 2.8rem);
      font-variant-numeric: tabular-nums;
      font-weight: 700;
    }

    .countdown-values small {
      color: #ffe0d8;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .tree {
      position: fixed;
      bottom: 10px;
      left: 16px;
      z-index: 2;
      width: 76px;
      height: 112px;
      pointer-events: none;
      filter: drop-shadow(0 0 9px rgb(255 224 133 / 35%));
    }

    .tree-star {
      position: absolute;
      top: 0;
      left: 30px;
      color: #ffe780;
      font-size: 18px;
      text-shadow: 0 0 10px #fff1a0;
    }

    .tree-layer {
      position: absolute;
      left: 50%;
      width: 0;
      height: 0;
      border-right: solid transparent;
      border-left: solid transparent;
      transform: translateX(-50%);
      filter: drop-shadow(0 0 5px rgb(90 255 141 / 35%));
    }

    .tree-layer-one {
      top: 19px;
      border-right-width: 21px;
      border-bottom: 33px solid #168345;
      border-left-width: 21px;
    }

    .tree-layer-two {
      top: 37px;
      border-right-width: 29px;
      border-bottom: 39px solid #11723a;
      border-left-width: 29px;
    }

    .tree-layer-three {
      top: 57px;
      border-right-width: 37px;
      border-bottom: 40px solid #0e6032;
      border-left-width: 37px;
    }

    .tree-trunk {
      position: absolute;
      bottom: 0;
      left: 32px;
      width: 12px;
      height: 18px;
      border-radius: 2px;
      background: #81502c;
    }

    .tree-light {
      position: absolute;
      z-index: 1;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      box-shadow: 0 0 9px currentColor;
      animation: twinkle 1.5s ease-in-out infinite alternate;
    }

    .tree-light-one {
      top: 39px;
      left: 34px;
      color: #ffe568;
      background: currentColor;
    }

    .tree-light-two {
      top: 58px;
      left: 22px;
      color: #ff8b85;
      background: currentColor;
      animation-delay: 0.5s;
    }

    .tree-light-three {
      top: 67px;
      left: 46px;
      color: #8fe8ff;
      background: currentColor;
      animation-delay: 0.9s;
    }

    .tree-light-four {
      top: 84px;
      left: 33px;
      color: #ffe568;
      background: currentColor;
      animation-delay: 0.3s;
    }

    @keyframes twinkle {
      from {
        opacity: 0.55;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1.25);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <div class="bells bells-left" aria-hidden="true">🔔🎀</div>
  <div class="bells bells-right" aria-hidden="true">🎀🔔</div>
  <div class="sleigh" aria-hidden="true">🎅🛷</div>
  <div class="tree" aria-hidden="true">
    <span class="tree-star">★</span>
    <span class="tree-layer tree-layer-one"></span>
    <span class="tree-layer tree-layer-two"></span>
    <span class="tree-layer tree-layer-three"></span>
    <span class="tree-light tree-light-one"></span>
    <span class="tree-light tree-light-two"></span>
    <span class="tree-light tree-light-three"></span>
    <span class="tree-light tree-light-four"></span>
    <span class="tree-trunk"></span>
  </div>
  <main>
    <p class="greeting" aria-hidden="true">✦ Season's Greetings ✦</p>
    <h1>Christmas Countdown 2026</h1>
    <p class="intro">World clocks and India-time countdown, updated every second</p>

    <section class="clocks" aria-label="Current times around the world">
      <article class="clock-card">
        <h2>Moscow</h2>
        <time id="moscow-clock" aria-live="off"></time>
      </article>
      <article class="clock-card">
        <h2>India</h2>
        <time id="india-clock" aria-live="off"></time>
      </article>
      <article class="clock-card">
        <h2>Washington, D.C.</h2>
        <time id="washington-clock" aria-live="off"></time>
      </article>
    </section>

    <section class="countdown" aria-labelledby="countdown-title">
      <h2 id="countdown-title">Countdown to Christmas Day · Dec 25, 2026</h2>
      <div class="countdown-values" id="countdown" aria-live="off">
        <div><span id="days">0</span><small>Days</small></div>
        <div><span id="hours">00</span><small>Hours</small></div>
        <div><span id="minutes">00</span><small>Minutes</small></div>
        <div><span id="seconds">00</span><small>Seconds</small></div>
      </div>
    </section>
  </main>

  <script>
    const clocks = [
      ["moscow-clock", "Europe/Moscow"],
      ["india-clock", "Asia/Kolkata"],
      ["washington-clock", "America/New_York"]
    ].map(([id, timeZone]) => ({
      element: document.getElementById(id),
      formatter: new Intl.DateTimeFormat(undefined, {
        timeZone,
        dateStyle: "full",
        timeStyle: "medium",
        hourCycle: "h23"
      })
    }));

    function updateClocks() {
      const now = new Date();

      for (const { element, formatter } of clocks) {
        element.textContent = formatter.format(now);
      }

      const christmas = Date.UTC(2026, 11, 24, 18, 30);
      const secondsLeft = Math.max(0, Math.floor((christmas - now) / 1000));
      const days = Math.floor(secondsLeft / 86400);
      const hours = Math.floor((secondsLeft % 86400) / 3600);
      const minutes = Math.floor((secondsLeft % 3600) / 60);
      const seconds = secondsLeft % 60;

      document.getElementById("days").textContent = days;
      document.getElementById("hours").textContent = String(hours).padStart(2, "0");
      document.getElementById("minutes").textContent = String(minutes).padStart(2, "0");
      document.getElementById("seconds").textContent = String(seconds).padStart(2, "0");
    }

    updateClocks();
    setInterval(updateClocks, 1000);
  </script>
</body>
</html>
